name: CI/CD Pipeline - Database & Infrastructure

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # =========================================================================
  # 1. Terraform Syntax & Configuration Validation
  # =========================================================================
  terraform-validate:
    name: 🏗️ Terraform Format & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.0

      - name: Terraform Format Check
        run: terraform -chdir=terraform fmt -check

      - name: Terraform Init
        run: terraform -chdir=terraform init -backend=false

      - name: Terraform Validate
        run: terraform -chdir=terraform validate

  # =========================================================================
  # 2. Dockerfile Linting (Hadolint)
  # =========================================================================
  docker-lint:
    name: 🐳 Lint Dockerfile (Hadolint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error
          ignore: DL3018,DL3008

  # =========================================================================
  # 3. Security Vulnerability Scan (Trivy)
  # =========================================================================
  security-scan:
    name: 🛡️ Security Vulnerability Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan repository dependencies
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

  # =========================================================================
  # 4. Docker Build & Push to GitHub Container Registry (GHCR)
  # =========================================================================
  build-and-push:
    name: 📦 Build & Push Database Docker Image (GHCR)
    needs: [terraform-validate, docker-lint, security-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute lowercase image name
        id: prep
        run: |
          LOWER_IMAGE="${{ env.REGISTRY }}/${GITHUB_REPOSITORY,,}"
          printf 'image_name=%s\n' "$LOWER_IMAGE" >> "$GITHUB_OUTPUT"
          printf 'IMAGE_NAME=%s\n' "$LOWER_IMAGE" >> "$GITHUB_ENV"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=dev-latest,enable=${{ github.ref == 'refs/heads/develop' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =========================================================================
  # 5. Continuous Deployment to Coolify
  # =========================================================================
  deploy-coolify:
    name: 🚀 Deploy to Coolify
    needs: [build-and-push]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify Webhook
        env:
          WEBHOOK_URL: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "::warning ::Secret COOLIFY_DEPLOY_WEBHOOK_URL is not set. Add it in Settings > Secrets > Actions to enable automated deployment."
            echo "Deployment was not triggered; configure this secret to enable it."
            exit 1
          fi
          echo "Triggering Coolify deployment webhook via POST..."
          CURL_ARGS=(--silent --show-error --output /dev/null --write-out "%{http_code}" --fail --request POST)
          if [ -n "$COOLIFY_TOKEN" ]; then
            CURL_ARGS+=(--header "Authorization: Bearer $COOLIFY_TOKEN")
          fi
          STATUS=$(curl "${CURL_ARGS[@]}" "$WEBHOOK_URL") || {
            echo "::error ::Coolify webhook request failed."
            exit 1
          }
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
            echo "✅ Coolify deployment webhook triggered successfully (HTTP $STATUS)."
          else
            echo "::error ::Failed to trigger Coolify webhook (HTTP $STATUS)."
            exit 1
          fi
