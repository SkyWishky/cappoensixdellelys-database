services:
  database:
    image: postgres:16-alpine
    container_name: tamagochi-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tamagochi}
      POSTGRES_USER: ${POSTGRES_USER:-tamagochi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tamagochi_secret}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./seed.sql:/docker-entrypoint-initdb.d/01-seed.sql:ro
    ports:
      - "5432:5432"
    networks:
      - tamagochi-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tamagochi} -d ${POSTGRES_DB:-tamagochi}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    image: ghcr.io/skywishky/cappoensixdellelys-back:latest
    container_name: tamagochi-back
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-tamagochi}
      DB_USER: ${POSTGRES_USER:-tamagochi}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-tamagochi_secret}
      PET_DECAY_INTERVAL: 10000
    ports:
      - "8080:8080"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - tamagochi-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    image: ghcr.io/skywishky/cappoensixdellelys-front:latest
    container_name: tamagochi-front
    restart: unless-stopped
    environment:
      PORT: 80
      BACKEND_URL: http://backend:8080
    ports:
      - "${FRONT_PORT:-4200}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - tamagochi-network

volumes:
  db_data:

networks:
  tamagochi-network:
    driver: bridge
