services:
  database:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/skywishky/cappoensixdellelys-database:latest
    container_name: tamagochi-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-tamagochi}
      POSTGRES_USER: ${DB_USER:-tamagochi}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tamagochi}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./seed.sql:/docker-entrypoint-initdb.d/01-seed.sql:ro
    ports:
      - "5432:5432"
    networks:
      - tamagochi-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-tamagochi} -d ${DB_NAME:-tamagochi}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ../cappoensixdellelys-back
      dockerfile: Dockerfile
    image: ghcr.io/skywishky/cappoensixdellelys-back:latest
    container_name: tamagochi-back
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-tamagochi}
      DB_USER: ${DB_USER:-tamagochi}
      DB_PASSWORD: ${DB_PASSWORD:-tamagochi}
      PET_DECAY_INTERVAL: ${PET_DECAY_INTERVAL:-10s}
    ports:
      - "8080:8080"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - tamagochi-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ../cappoensixdellelys-front
      dockerfile: Dockerfile
    image: ghcr.io/skywishky/cappoensixdellelys-front:latest
    container_name: tamagochi-front
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "${FRONT_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - tamagochi-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  db_data:
    driver: local

networks:
  tamagochi-network:
    driver: bridge
