services:
  database:
    image: ghcr.io/skywishky/cappoensixdellelys-database:latest
    pull_policy: always
    container_name: tamagochi-db-coolify
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tamagochi}
      POSTGRES_USER: ${POSTGRES_USER:-tamagochi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Coolify}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tamagochi} -d ${POSTGRES_DB:-tamagochi}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
      - "coolify.managed=true"

  backend:
    image: ghcr.io/skywishky/cappoensixdellelys-back:latest
    pull_policy: always
    container_name: tamagochi-back-coolify
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-tamagochi}
      DB_USER: ${POSTGRES_USER:-tamagochi}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Coolify}
      PET_DECAY_INTERVAL: 10000
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - "coolify.managed=true"

  frontend:
    image: ghcr.io/skywishky/cappoensixdellelys-front:latest
    pull_policy: always
    container_name: tamagochi-front-coolify
    restart: unless-stopped
    environment:
      PORT: 8080
      BACKEND_URL: http://backend:8080
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    labels:
      - "coolify.managed=true"

volumes:
  db_data:
